# =============================================================================
#  KK-BOOK - Cỗ máy tự động: tải toàn bộ PDF từ Google Drive vào repo này.
#  Chạy hoàn toàn trên máy chủ GitHub (anh KHÔNG cần cài gì trên máy tính).
#  Cách chạy: vào tab "Actions" của repo -> chọn workflow này -> bấm "Run workflow".
#  Kết quả: các file PDF (đặt tên theo driveId) nằm trong thư mục pdfs/ của repo.
# =============================================================================
name: Tai PDF tu Drive vao repo

on:
  workflow_dispatch:        # nút bấm chạy tay trong tab Actions
  schedule:
    - cron: '0 19 * * *'    # TỰ ĐỘNG chạy mỗi ngày (~02:00 giờ VN) để đồng bộ sách mới từ Drive sang GitHub

permissions:
  contents: write           # cho phép ghi file vào repo

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon repo
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tai toan bo PDF tu Drive
        run: |
          cat > _migrate.js <<'JSEOF'
          'use strict';
          const fs=require('fs'), https=require('https'), path=require('path');
          const API_KEY='AIzaSyByBzqafYN-Ytt2_DkE7GaJIbuUxcY1fQE';
          const CATALOG_ID='1no2ekPA7AyESPd-O_RvHIy1pOtRWnvzm';
          const OUT_DIR='pdfs', RETRY=2, DELAY_MS=350;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function get(url,depth){depth=depth||0;return new Promise((resolve,reject)=>{
            https.get(url,res=>{
              if(res.statusCode>=300&&res.statusCode<400&&res.headers.location&&depth<5){res.resume();return resolve(get(res.headers.location,depth+1));}
              if(res.statusCode!==200){let b='';res.on('data',d=>b+=d);res.on('end',()=>reject(new Error('HTTP '+res.statusCode+' '+String(b).slice(0,140))));return;}
              const ch=[];res.on('data',d=>ch.push(d));res.on('end',()=>resolve(Buffer.concat(ch)));
            }).on('error',reject);
          });}
          async function dl(id){const url='https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&supportsAllDrives=true&key='+API_KEY;let e=null;
            for(let k=0;k<=RETRY;k++){try{const b=await get(url);if(!b||b.length<100)throw new Error('file rong');if(b[0]===0x7b)throw new Error('Drive tra loi: '+b.toString('utf8').slice(0,140));return b;}catch(x){e=x;if(k<RETRY)await sleep(900);}}throw e;}
          (async()=>{
            if(!fs.existsSync(OUT_DIR))fs.mkdirSync(OUT_DIR,{recursive:true});
            console.log('Tai danh muc...');
            const cat=JSON.parse((await get('https://www.googleapis.com/drive/v3/files/'+CATALOG_ID+'?alt=media&key='+API_KEY)).toString('utf8'));
            const books=(cat.books||[]).filter(b=>b&&b.driveId);
            console.log('So sach co file:',books.length);
            const man=[];let ok=0,skip=0,fail=0;
            for(let i=0;i<books.length;i++){const b=books[i];const f=b.driveId+'.pdf';const p=path.join(OUT_DIR,f);
              const lbl='['+(i+1)+'/'+books.length+'] '+String(b.title||b.id||b.driveId).slice(0,45);
              if(fs.existsSync(p)&&fs.statSync(p).size>100){console.log(lbl+' -> da co, bo qua');skip++;man.push({id:b.id,driveId:b.driveId,file:OUT_DIR+'/'+f,title:b.title,status:'skip'});continue;}
              try{const buf=await dl(b.driveId);fs.writeFileSync(p,buf);console.log(lbl+' -> OK '+(buf.length/1048576).toFixed(1)+'MB');ok++;man.push({id:b.id,driveId:b.driveId,file:OUT_DIR+'/'+f,title:b.title,status:'ok',bytes:buf.length});}
              catch(x){console.log(lbl+' -> LOI: '+x.message);fail++;man.push({id:b.id,driveId:b.driveId,file:OUT_DIR+'/'+f,title:b.title,status:'fail',error:x.message});}
              await sleep(DELAY_MS);
            }
            fs.writeFileSync('manifest.json',JSON.stringify(man,null,2),'utf8');
            console.log('XONG. OK:'+ok+' | da co:'+skip+' | loi:'+fail+' | tong:'+books.length);
            if(fail>0){console.log('Cac cuon loi (co the do Drive tam khoa luot tai) - chay lai workflow sau vai gio se tai tiep phan con thieu.');}
          })().catch(e=>{console.error('LOI:',e.message);process.exit(1);});
          JSEOF
          node _migrate.js
          rm -f _migrate.js

      - name: Luu PDF vao repo
        run: |
          git config user.name "kkbook-bot"
          git config user.email "kkbook-bot@users.noreply.github.com"
          git add pdfs manifest.json
          git commit -m "Tu dong tai PDF tu Drive vao repo" || echo "Khong co thay doi de luu"
          git push
